<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>player frame</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    video { width: 100%; height: 100%; }
    #preview { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #234; color: #fff; font: 40px sans-serif; text-align: center; padding-top: 20%; box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="preview">click to play</div>
  <script>
    // like many players: the video element is only created after a click
    document.getElementById('preview').addEventListener('click', function () {
      this.parentNode.removeChild(this);
      var video = document.createElement('video');
      video.src = 'https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.mp4';
      document.body.appendChild(video);
    });
  </script>
</body>
</html>
