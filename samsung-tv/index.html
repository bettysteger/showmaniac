<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, user-scalable=no">
  <title>showmaniac</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="stage">
    <div id="backdrop">
      <div class="bg-layer"></div>
      <div class="bg-layer"></div>
      <div class="bg-shade"></div>
    </div>

    <div id="views"></div>

    <div id="topbar" data-nav-row>
      <img class="logo" src="images/logo.png" alt="showmaniac">
      <div id="menu"></div>
      <div id="busy" class="hidden"></div>
    </div>

    <div id="dialog" class="hidden"></div>
    <div id="toast" class="hidden"></div>
  </div>

  <!-- Samsung TV functions (screen saver), only available on the TV -->
  <script src="$WEBAPIS/webapis/webapis.js" onerror="void 0"></script>

  <!-- API keys, generated by tools/config.mjs. The app still starts without it. -->
  <script src="js/config.js" onerror="window.SM_CONFIG = {}"></script>
  <script src="js/util.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/player.js"></script>
  <script src="js/services.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/detail.js"></script>
  <script src="js/views/search.js"></script>
  <script src="js/views/account.js"></script>
  <script src="js/views/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
